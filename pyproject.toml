
[project]
name = "documind-ai"
version = "0.1.0"
description = "AI-powered document question answering assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "numpy>=2.0,<3.0",
    "google-genai>=1.0,<2.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.vercel]
entrypoint = "api:app"
